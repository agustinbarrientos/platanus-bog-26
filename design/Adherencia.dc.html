<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
  <style>
  body { margin: 0; background: oklch(0.982 0.008 215); font-family: 'Nunito', 'Avenir Next', 'Segoe UI', system-ui, sans-serif; color: oklch(0.30 0.028 245);
         -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: oklch(0.46 0.075 240); text-decoration: none; }
  a:hover { color: oklch(0.30 0.028 245); }
  @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); }
                       50% { transform: translateY(-3px) scale(1.025); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes draw { from { stroke-dashoffset: 620; } to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
.stop { cursor: pointer; transition: transform .16s ease; }
        .stop:hover { transform: scale(1.08); }
        .thumb { transition: left .22s cubic-bezier(.34,1.3,.5,1); }</style>
</helmet>
<div style="width: 390px; height: 844px; background: oklch(0.982 0.008 215); position: relative;
    overflow: hidden; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 8px;">
    <div style="width: 44px; height: 44px; margin-left: -11px; border-radius: 22px;
        display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.53 0.022 245)"
    stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div style="flex-grow: 1; font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-size: 17px; font-weight: 500;">Dejar de fumar</div>
    <div style="display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 14px;
    border-radius: 22px; background: oklch(0.935 0.032 232); color: oklch(0.46 0.075 240);
    font-size: 12.5px; font-weight: 700; white-space: nowrap;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.46 0.075 240)"
    stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg><span>calibración 88%</span></div>
  </div>
  <div style="padding: 14px 24px 0; display: flex; flex-direction: column; align-items: center;
    gap: 14px; text-align: center;">
    <svg width="88" height="88" viewBox="0 0 100 100" fill="none" aria-hidden="true"
      style="animation: breathe 4.2s ease-in-out infinite; overflow: visible">
    
    <path d="M50 12 C70 12 82 28 82 46 C82 66 68 80 50 80 C32 80 18 66 18 46 C18 28 30 12 50 12 Z"
          fill="oklch(0.935 0.032 158)" stroke="oklch(0.72 0.085 158)" stroke-width="2.5"/>
    <ellipse cx="28" cy="52" rx="5" ry="3.6" fill="oklch(0.72 0.085 158)" opacity=".28"/>
    <ellipse cx="72" cy="52" rx="5" ry="3.6" fill="oklch(0.72 0.085 158)" opacity=".28"/>
    <path d="M79 52 q10 -3 11 -12" stroke="oklch(0.72 0.085 158)" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="37" cy="43" rx="3.6" ry="4.2" fill="oklch(0.44 0.070 160)" style="animation: blink 6.5s infinite"/>
       <ellipse cx="63" cy="43" rx="3.6" ry="4.2" fill="oklch(0.44 0.070 160)" style="animation: blink 6.5s infinite"/><path d="M43 55 q7 3 14 0" stroke="oklch(0.44 0.070 160)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/>
  </svg>
    <div style="font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-size: 25px; font-weight: 500; line-height: 1.2;">
      ¿Cuánto tiempo<br>lo sostienes?</div>
    <div style="font-size: 14.5px; color: oklch(0.53 0.022 245); line-height: 1.55; max-width: 300px; text-wrap: pretty;">
      Nadie lo sostiene todo. Prefiero simular lo que de verdad va a pasar
      y no lo que se supone que debo decirte.</div>
  </div>

  <div style="margin: 26px 24px 0;">
    <div style="position: relative; height: 44px;">
      <div style="position: absolute; top: 19px; left: 11px; right: 11px; height: 6px;
        border-radius: 3px; background: oklch(0.966 0.012 212);"></div>
      <div style="display: flex; justify-content: space-between; position: relative;">
        <sc-for list="{{stops}}" as="s" hint-placeholder-count="4">
          <div class="stop" onClick="{{s.pick}}" style="display: flex; flex-direction: column;
            align-items: center; gap: 8px; width: 72px; padding-top: 13px;">
            <div style="width: 18px; height: 18px; border-radius: 9px; background: {{s.dot}};
              border: 3px solid oklch(1 0.002 215); box-shadow: 0 0 0 1px {{s.dot}};"></div>
            <span style="font-size: 12.5px; font-weight: {{s.wt}}; color: {{s.col}};">{{s.lab}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="margin: 24px 20px 0; padding: 20px 18px; background: oklch(0.935 0.032 158);
    border-radius: 26px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
    <div style="display: flex; align-items: baseline; gap: 9px;">
      <span style="font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-size: 52px; font-weight: 600; line-height: 1;
        color: oklch(0.44 0.070 160);">{{cur.d}}</span>
      <span style="font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-size: 19px; font-weight: 500; color: oklch(0.44 0.070 160);">
        años sanos</span></div>
    <div style="font-size: 14px; font-weight: 700; color: oklch(0.44 0.070 160);">
      te ayuda en {{cur.pct}} de tus futuros</div>
    <div style="font-size: 14px; color: oklch(0.53 0.022 245); line-height: 1.5; text-align: center;
      padding-top: 4px; text-wrap: pretty;">{{cur.note}}</div>
  </div>

  <div style="padding: 18px 24px 40px; margin-top: auto;">
    <div style="height: 54px; border-radius: 27px; display: flex; align-items: center;
    justify-content: center; font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-size: 16.5px; font-weight: 500;
    background: oklch(0.72 0.085 158); color: oklch(1 0 0); border: none; ">Guardar como mi plan</div></div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 1 }; }
  renderVals() {
    const opts = [
      { lab: '3 meses',  d: '+0,6', pct: '38%', note: 'Poco, pero no es cero. Nunca es cero.' },
      { lab: '8 meses',  d: '+1,3', pct: '61%', note: 'Aunque aflojes después, esto se te queda.' },
      { lab: '2 años',   d: '+2,9', pct: '79%', note: 'Aquí el cuerpo ya cambió lo que tenía que cambiar.' },
      { lab: 'Siempre',  d: '+4,2', pct: '87%', note: 'El escenario ideal. Casi nadie vive aquí, y está bien.' },
    ];
    const i = this.state.i;
    return {
      cur: opts[i],
      thumbLeft: 'calc(' + (i * 33.333) + '% - ' + (i * 22 - 0) + 'px)',
      stops: opts.map((o, k) => ({ lab: o.lab,
        pick: () => this.setState({ i: k }),
        dot: k <= i ? 'oklch(0.72 0.085 158)' : 'oklch(0.915 0.012 220)',
        col: k === i ? 'oklch(0.44 0.070 160)' : 'oklch(0.67 0.018 245)',
        wt: k === i ? 700 : 600 })),
    };
  }
}
</script>
</body>
</html>
